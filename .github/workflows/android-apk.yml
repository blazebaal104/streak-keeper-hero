name: Build Android APK
on:
  push:
    branches: [migrate-cloudflare]
    paths: [android/**, .github/workflows/android-apk.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }
      - name: Check signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$PW" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD repository secrets first."; exit 1
          fi
      - name: Build signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_B64 }}" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.jks"
          export KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1 || { echo "::error::Keystore or password secret is wrong (could not open the keystore)."; exit 1; }
          set +e
          gradle -p android assembleRelease --no-daemon > build.log 2>&1
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            grep -E "error:|What went wrong|^> |Could not|FAILURE|AAPT|e: " build.log | head -15 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          cp android/app/build/outputs/apk/release/app-release.apk SBO.apk
      - uses: actions/upload-artifact@v4
        with: { name: SBO-apk, path: SBO.apk }
      - name: Publish as release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "apk-${{ github.run_number }}" SBO.apk --title "SBO Android ${{ github.run_number }}" --notes "APK firmato per Android." --target "${{ github.sha }}"

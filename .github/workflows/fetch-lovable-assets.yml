name: Fetch Lovable assets (one-off)
on:
  push:
    branches: [migrate-cloudflare]
    paths: [.github/workflows/fetch-lovable-assets.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download assets from the Lovable site
        run: |
          set -e
          mkdir -p public/sbo
          base=https://streak-keeper-hero.lovable.app/__l5e/assets-v1
          for p in \
            768b9568-3abb-472c-afa0-b04382f3f839/fire-blaze.mp4 \
            e4b5a8cb-b545-40ae-a367-510a84a43058/fire-blaze.webm \
            5f815a03-4b97-4ae3-9d34-3ef3e3b674d7/ice-1.webp \
            d130ab4b-c1a2-4c66-8b9a-b09f4fec1324/ice-2.webp \
            1a8db5c4-a7f9-45e4-8cc3-8b24271b4ae9/ice-3.webp \
            717464b3-ae97-4b85-acd5-5766164d6cf1/ice-4.webp \
            bd1d1e0a-a527-4333-8a9d-034899c6baa5/ice-5.webp \
            70c689ff-818c-44a1-9efc-0aadce27a799/ice-shards.png; do
            curl -fsSL "$base/$p" -o "public/sbo/$(basename $p)"
          done
          ls -l public/sbo
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add public/sbo
          git commit -m "Add streak assets downloaded from the Lovable site" || echo "nothing to commit"
          git push

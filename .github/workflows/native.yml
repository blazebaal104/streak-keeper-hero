name: Native app (build + screenshots)
on:
  push:
    branches: [native]
    paths: [android-native/**, .github/workflows/native.yml]
  workflow_dispatch:
    inputs:
      device:
        description: "Also screenshot on an emulator (slow, flaky)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency: { group: native-shots, cancel-in-progress: true }
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }
      - name: Fetch fonts and icons
        run: bash android-native/ci/prepare.sh
      - name: Build + render screenshots (Roborazzi)
        run: |
          set +e
          mkdir -p shots
          timeout 2100 gradle -p android-native assembleDevDebug testDevDebugUnitTest -Proborazzi.test.record=true --no-daemon > shots/build.log 2>&1
          rc=$?
          cp android-native/app/build/shots/*.png shots/ 2>/dev/null
          find android-native/app/build/test-results -name "*.xml" -exec cp {} shots/ \; 2>/dev/null
          if [ $rc -ne 0 ]; then grep -E "^e: |error:|What went wrong|Could not|FAILED|Exception" shots/build.log | head -30 | while IFS= read -r l; do echo "::error::$l"; done; fi
          exit 0
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with: { name: native, path: shots, retention-days: 1 }
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with: { retention-days: 1, name: apk, path: android-native/app/build/outputs/apk/dev/debug/app-dev-debug.apk, if-no-files-found: ignore }
  release:
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }
      - name: Signed native APKs (SBO Dev + SBO)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          bash android-native/ci/prepare.sh
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_B64 }}" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.jks"
          export KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          gradle -p android-native assembleDevRelease assembleProdRelease --no-daemon > rel.log 2>&1 || { grep -E "^e: |error:|Error:|What went wrong|FAILED|Lint found" -A4 rel.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
          cp android-native/app/build/outputs/apk/dev/release/app-dev-release.apk SBO-Dev-native.apk
          cp android-native/app/build/outputs/apk/prod/release/app-prod-release.apk SBO.apk
          gh release create "native-dev-${{ github.run_number }}" SBO-Dev-native.apk --prerelease --title "SBO Dev nativa ${{ github.run_number }}" --notes "App nativa (Kotlin/Compose), versione di prova." --target "${{ github.sha }}"
          gh release create "native-${{ github.run_number }}" SBO.apk --prerelease --title "SBO ${{ github.run_number }} (ufficiale, nativa)" --notes "App ufficiale nativa: login con email e password, dati reali." --target "${{ github.sha }}"
  device:
    if: github.event_name == 'workflow_dispatch' && inputs.device
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: apk, path: android-native/app/build/outputs/apk/dev/debug }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        continue-on-error: true
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_4
          ram-size: 3072M
          cores: 3
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: false
          script: bash android-native/ci/shots.sh
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        if: always()
        with: { name: device, path: shots, if-no-files-found: ignore }
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Web screenshot
        run: |
          mkdir -p shots && cd android-native/ci && npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          cd ../.. && node android-native/ci/web-shot.mjs
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with: { name: web, path: shots }
  publish:
    needs: [native, web, device]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: in }
      - name: Push screenshots to ci-shots branch
        run: |
          D="run-${{ github.run_number }}"
          mkdir -p out/$D
          for a in native web device; do [ -d in/$a ] && cp -r in/$a/* out/$D/; done
          cd out
          git init -q && git checkout -q -b ci-shots
          git config user.name "github-actions[bot]" && git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch -q --depth 1 origin ci-shots && git reset -q --soft FETCH_HEAD || true
          git add -A && git commit -q -m "Screenshots $D (${{ github.sha }})" && git push -q origin ci-shots

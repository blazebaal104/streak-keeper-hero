name: NNN sprites (Blender)
on:
  workflow_dispatch:
  push:
    branches: [native]
    paths: ["android-native/blender/**"]
concurrency: { group: nnn-sprites, cancel-in-progress: true }
permissions: { contents: write }
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        group:
          - "safe beam steel_plate"
          - "chain_padlock handcuffs u_lock zip_ties"
          - "barbed_wire glass_case rope grate"
          - "box sandbags bricks duct_tape"
          - "tape safe beam steel_plate chain_padlock handcuffs u_lock zip_ties"
          - "tape barbed_wire glass_case rope grate box sandbags bricks duct_tape"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Blender (bpy)
        run: |
          pip install --quiet bpy==5.0.1 pillow
          sudo apt-get install -y -qq libxi6 libxkbcommon0 libsm6 libgl1 >/dev/null || true
      - name: Render
        run: |
          cd android-native/blender
          OUT=$PWD/out python render.py ${{ matrix.group }} 2>&1 | grep -E "rendered|Error|Traceback|File \"|line [0-9]+" || true
          ls out | wc -l
      - name: Pack + commit
        run: |
          python android-native/blender/pack.py android-native/blender/out android-native/app/src/main/res/drawable-nodpi
          git config user.name "github-actions[bot]" && git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add android-native/app/src/main/res/drawable-nodpi/nnn_*.webp android-native/app/src/main/assets/nnn
          git commit -q -m "NNN sprites: ${{ matrix.group }}" || exit 0
          for i in 1 2 3 4 5 6; do git pull -q --rebase origin native && git push -q origin HEAD:native && break; sleep $((RANDOM % 10 + 3)); done

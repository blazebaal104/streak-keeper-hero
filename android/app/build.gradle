plugins { id "com.android.application" }

def webHost = "sbo.perlospam696.workers.dev"

android {
    namespace "com.sbo.app"
    compileSdk 35
    defaultConfig {
        applicationId "com.sbo.app"
        minSdk 21
        targetSdk 35
        versionCode = Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")
        versionName = "1.0." + (System.getenv("VERSION_CODE") ?: "1")
        resValue "string", "launchUrl", "https://" + webHost + "/"
        resValue "string", "hostName", webHost
        resValue "string", "asset_statements",
            "[{\\\"relation\\\": [\\\"delegate_permission/common.handle_all_urls\\\"], \\\"target\\\": {\\\"namespace\\\": \\\"web\\\", \\\"site\\\": \\\"https://" + webHost + "\\\"}}]"
        manifestPlaceholders = [hostName: webHost]
    }
    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_PATH") ?: "release.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias "sbo"
            keyPassword System.getenv("KEYSTORE_PASSWORD")
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.5.0"
}

name: NNN sprites (Blender)
on:
  workflow_dispatch:
    inputs:
      groups: { description: 'JSON list of render groups (empty = all)', required: false, default: '' }
  push:
    branches: [native]
    paths: ["android-native/blender/__never__"]
concurrency: { group: nnn-sprites, cancel-in-progress: true }
permissions: { contents: write }
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(github.event.inputs.groups != '' && github.event.inputs.groups || '["safe beam steel_plate","chain_padlock handcuffs u_lock zip_ties","barbed_wire glass_case rope grate","box sandbags bricks duct_tape","tape safe beam steel_plate chain_padlock handcuffs u_lock zip_ties","tape barbed_wire glass_case rope grate box sandbags bricks duct_tape"]') }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Blender (bpy)
        run: |
          pip install --quiet bpy==5.0.1 pillow
          sudo apt-get install -y -qq libxi6 libxkbcommon0 libsm6 libgl1 >/dev/null || true
      - name: Render
        run: |
          cd android-native/blender
          set +e
          OUT=$PWD/out python render.py ${{ matrix.group }} > render.log 2>&1
          rc=$?
          grep -E "rendered" render.log | tail -3
          n=$(ls out 2>/dev/null | grep -c png)
          echo "::notice::rc=$rc pngs=$n"
          if [ $rc -ne 0 ] || [ "$n" = "0" ]; then grep -vE "^Fra|Sample|Updating|Synchroniz|Compiling|Loading" render.log | tail -25 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; fi
      - name: Publish renders on their own branch (no rebase, no conflicts)
        run: |
          B="sprites/${{ github.run_id }}-${{ strategy.job-index }}"
          mkdir -p /tmp/pub && cp android-native/blender/out/*.png /tmp/pub/ && cp android-native/blender/out/*.json /tmp/pub/ 2>/dev/null || true
          cd /tmp/pub && rm -f _*.png
          git init -q && git checkout -q -b pub
          git config user.name "github-actions[bot]" && git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "renders: ${{ matrix.group }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" pub:refs/heads/$B
          echo "::notice::pushed $(ls | wc -l) files to $B"

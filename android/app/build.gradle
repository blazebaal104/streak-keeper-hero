plugins { id "com.android.application" }

def statementsFor(String host) {
    return "[{\\\"relation\\\": [\\\"delegate_permission/common.handle_all_urls\\\"], \\\"target\\\": {\\\"namespace\\\": \\\"web\\\", \\\"site\\\": \\\"https://" + host + "\\\"}}]"
}

android {
    namespace "com.sbo.app"
    compileSdk 35
    defaultConfig {
        applicationId "com.sbo.app"
        minSdk 21
        targetSdk 35
        versionCode = Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")
        versionName = "1.0." + (System.getenv("VERSION_CODE") ?: "1")
    }
    flavorDimensions "env"
    productFlavors {
        prod {
            dimension "env"
            def host = "sbo.perlospam696.workers.dev"
            resValue "string", "app_name", "SBO"
            resValue "string", "launchUrl", "https://" + host + "/"
            resValue "string", "asset_statements", statementsFor(host)
            manifestPlaceholders = [hostName: host]
        }
        dev {
            dimension "env"
            // Installs next to the real app: different package, name and icon.
            applicationIdSuffix ".dev"
            def host = "sbo-dev.perlospam696.workers.dev"
            resValue "string", "app_name", "SBO Dev"
            resValue "string", "launchUrl", "https://" + host + "/"
            resValue "string", "asset_statements", statementsFor(host)
            manifestPlaceholders = [hostName: host]
        }
    }
    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_PATH") ?: "release.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias "sbo"
            keyPassword System.getenv("KEYSTORE_PASSWORD")
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.5.0"
}

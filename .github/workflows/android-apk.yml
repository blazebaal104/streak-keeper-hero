name: Build Android APK
on:
  push:
    branches: [migrate-cloudflare, dev]
    paths: [android/**, .github/workflows/android-apk.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }
      - name: Check signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$PW" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD repository secrets first."; exit 1
          fi
      - name: Build signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_B64 }}" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.jks"
          export KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1 || { echo "::error::Keystore or password secret is wrong (could not open the keystore)."; exit 1; }
          set +e
          if [ "${GITHUB_REF_NAME}" = "dev" ]; then FLAVOR=dev; NAME="SBO-Dev"; else FLAVOR=prod; NAME="SBO"; fi
          echo "FLAVOR=$FLAVOR" >> "$GITHUB_ENV"; echo "APK_NAME=$NAME" >> "$GITHUB_ENV"
          T=$(echo "$FLAVOR" | sed 's/./\U&/')
          gradle -p android "assemble${T}Release" --no-daemon > build.log 2>&1
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            grep -E "error:|What went wrong|^> |Could not|FAILURE|AAPT|e: " build.log | head -15 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          cp "android/app/build/outputs/apk/$FLAVOR/release/app-$FLAVOR-release.apk" "$APK_NAME.apk"
      - uses: actions/upload-artifact@v4
        with: { name: "${{ env.APK_NAME }}-apk", path: "${{ env.APK_NAME }}.apk" }
      - name: Publish as release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          PRE=""; [ "$FLAVOR" = "dev" ] && PRE="--prerelease"
          gh release create "apk-$FLAVOR-${{ github.run_number }}" "$APK_NAME.apk" --title "$APK_NAME Android ${{ github.run_number }}" --notes "APK firmato per Android ($FLAVOR)." --target "${{ github.sha }}" $PRE 2> err.txt || { while IFS= read -r l; do echo "::error::$l"; done < err.txt; exit 1; }
